name: Reconcile catalog issue graph
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect only, or explicitly apply the reviewed issue graph
        type: choice
        options: [inspect, apply]
        default: inspect
        required: true
      expected_plan_sha256:
        description: SHA-256 of the exact reviewed planning/github-issue-payloads.json bytes
        type: string
        required: true
      resume_journal:
        description: Exact RESUME_JOURNAL_JSON receipt after an interrupted or uncertain prior run; otherwise empty
        type: string
        required: false
permissions:
  contents: read
  issues: write
concurrency:
  group: catalog-issue-graph
  cancel-in-progress: false
jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Pick-Your-AI/pick-your-ai-catalog-pipeline' &&
      github.repository_id == '1430404474' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (github.actor == 'CompleteDotTech' || github.actor == 'BunsDev') &&
      (github.triggering_actor == 'CompleteDotTech' || github.triggering_actor == 'BunsDev')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # organization-audited v4 pin
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # organization-audited v5 pin
        with:
          python-version: '3.12'
      - name: Reconcile only existing catalog issues
        env:
          GH_TOKEN: ${{ github.token }}
          GRAPH_MODE: ${{ inputs.mode }}
          GRAPH_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          GRAPH_RESUME_JOURNAL: ${{ inputs.resume_journal }}
        run: |
          case "$GRAPH_MODE" in
            inspect) python scripts/reconcile_issue_graph.py --inspect --expected-plan-sha256 "$GRAPH_PLAN_SHA256" ;;
            apply) python scripts/reconcile_issue_graph.py --apply --expected-plan-sha256 "$GRAPH_PLAN_SHA256" ;;
            *) exit 2 ;;
          esac
