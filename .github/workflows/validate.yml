name: Catalog bootstrap validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: catalog-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci-required:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # organization-audited v4 pin
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # organization-audited v5 pin
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Validate planning, coverage and dependency graph
        run: python scripts/validate_plan.py
      - name: Validate synthetic draft examples and rejection boundaries
        run: python scripts/validate_examples.py
      - name: Verify generated documents and issue payloads
        run: python scripts/render_docs.py --check
      - name: Run meaningful positive and negative tests
        run: python -m unittest discover -s tests -v
